.bgb{filter:blur(28px) brightness(.97);transform:scale(1.12);opacity:0;transition:opacity .5s}
body.blur .bgb{opacity:1}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;transform:translate(-50%,-50%)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.screen.on{opacity:1;visibility:visible}
.card{position:absolute;background:#000;border-radius:60px}
.title{position:absolute;left:0;right:0;top:196px;text-align:center;font-size:54px;line-height:64px;letter-spacing:.5px}
.sub{position:absolute;left:0;right:0;top:262px;text-align:center;font-size:38px;line-height:44px}
.brand{position:absolute;left:0;right:0;top:310px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:58px;height:64px}
.brand img{height:62px}
.pill{position:absolute;left:334px;width:1246px;height:67px;border-radius:34px;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;border:3px solid transparent;transition:background .2s,border-color .2s}
.pill.sel{background:#2b2b2b;border-color:#fff}
.pill:hover{background:#272727}
.btn{position:absolute;left:849px;top:580px;width:222px;height:67px;border-radius:34px;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;border:3px solid transparent;font-family:var(--head);font-weight:800;color:#fff;text-transform:uppercase;transition:background .2s}
.btn:hover,.btn:focus-visible{background:#333;outline:none;border-color:#fff}
.btn.wide{width:auto;padding:0 44px;left:50%;transform:translateX(-50%)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.btn.wide.shake{animation:shakew .4s}
@keyframes shakew{20%{transform:translateX(calc(-50% - 10px))}40%{transform:translateX(calc(-50% + 10px))}60%{transform:translateX(calc(-50% - 6px))}80%{transform:translateX(calc(-50% + 6px))}}
.field{padding:0 21px;justify-content:flex-start;gap:20px;cursor:text}
.field label{font-size:25px;white-space:nowrap;cursor:text}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:25px;text-transform:none;font-weight:500;letter-spacing:.5px;height:100%}
.field input::placeholder{color:#777;letter-spacing:1px}
.field .suffix{font-size:25px;padding-right:18px}
.field:focus-within{border-color:#fff}
.note{position:absolute;left:334px;width:1246px;top:690px;text-align:center;font-size:20px;line-height:30px;font-weight:500;color:#bbb;text-transform:none}
#clockText{position:absolute;left:0;right:0;top:310px;text-align:center;font-family:var(--clock);font-weight:400;font-size:410px;line-height:380px;color:#fff;filter:url(#rough);letter-spacing:-6px;font-variant-numeric:tabular-nums;cursor:pointer}
.chips{position:absolute;left:0;right:0;bottom:130px;display:flex;justify-content:center;gap:18px}
.chip{background:rgba(0,0,0,.82);border-radius:30px;padding:14px 28px;font-size:22px;cursor:pointer;display:flex;gap:12px;align-items:center}
.hint{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:19px;font-weight:500;text-transform:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.micbtn{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:auto;display:none}
.home{position:absolute;left:30px;top:18px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:transparent;border-radius:20px}
.home:focus-visible,.home:hover{background:rgba(0,0,0,.25);outline:none}
.home svg{width:72px;height:72px}
.imgcard{position:absolute;left:303px;top:108px;width:1308px;height:864px;border-radius:44px;overflow:hidden;background:#101820;display:flex;align-items:center;justify-content:center}
.imgcard img{width:100%;height:100%;object-fit:cover;display:block}
.imgcard .msg{font-size:34px;text-align:center;padding:60px;line-height:1.3}
.imgcap{position:absolute;left:303px;width:1308px;top:990px;text-align:center;font-size:24px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.spin{width:70px;height:70px;border-radius:50%;border:8px solid #333;border-top-color:#fff;animation:rot 1s linear infinite;margin:0 auto 26px}
@keyframes rot{to{transform:rotate(360deg)}}
.big{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:var(--clock);font-weight:400;font-size:330px;line-height:330px;color:#fff;filter:url(#rough);letter-spacing:-4px}
.lbl{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:46px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.lbl2{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:36px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
#bar{position:absolute;left:0;top:0;width:1920px;height:95px;background:linear-gradient(90deg,#000 0,#000 960px,rgba(0,0,0,0) 1920px);transform:translateY(-100%);transition:transform .35s;z-index:20;display:flex;align-items:center;padding-left:18px;gap:16px}
#bar.on{transform:none}
#bar img{height:56px}
#bar .wae{font-size:46px;margin-right:6px}
.dots{display:flex;align-items:center;gap:9px;height:40px}
.dots i{display:block;border-radius:50%;background:#fff;width:18px;height:18px}
.dots i:nth-child(1),.dots i:nth-child(5){width:16px;height:16px}
.dots i:nth-child(3){width:32px;height:32px}
#bar.listen .dots i{animation:pulse 1s ease-in-out infinite}

let lang='en',screen='s-lang',dict=null,ctx=null;
const L=()=>T[lang];

/* ---------- stage scaling ---------- */
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();

/* ---------- screens ---------- */
function go(id){
 if(id!=='s-info'&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}
 screen=id;$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
 document.body.classList.toggle('blur',['s-lang','s-acct','s-img','s-music','s-info'].includes(id));
 if(id==='s-clock')renderChips();
}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function audioInit(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}

/* ---------- onboarding ---------- */
function pick(l){lang=l;$$('[data-lang]').forEach(p=>p.classList.toggle('sel',p.dataset.lang===l))}
$$('[data-lang]').forEach(p=>{p.onclick=()=>pick(p.dataset.lang);p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(p.dataset.lang)}}});
let picked=false;
$$('[data-lang]').forEach(p=>p.addEventListener('click',()=>picked=true));
$$('[data-lang]').forEach(p=>p.addEventListener('keydown',()=>picked=true));
$('#b-lang').onclick=()=>{
 audioInit();
 if(!picked){shake($('#p-en'));shake($('#p-nl'));return}
 applyLang();go('s-acct');setTimeout(()=>$('#i-mail').focus(),480)};
function applyLang(){
 const t=L();document.documentElement.lang=lang;
 $('#a-title').textContent=t.welcome;$('#a-sub').textContent=t.start;$('#a-mail').textContent=t.mail;$('#a-pass').textContent=t.pass;
 $('#b-acct').textContent=t.next;$('#a-note').textContent=t.note;$('#hint').textContent=t.hint;$('#mic-l').textContent=t.speak;
 $('#q').placeholder=t.ex;$('#tm-x').textContent=t.cancel;$('#r-x').textContent=t.stop;
}
function acct(){
 const m=$('#i-mail'),p=$('#i-pass');
 if(!m.value.trim()){shake($('#f-mail'));m.focus();return}
 if(!p.value){shake($('#f-pass'));p.focus();return}
 /* fake account: nothing is stored or sent */
 m.value='';p.value='';go('s-clock');tick(true)}
$('#b-acct').onclick=acct;
['#i-mail','#i-pass'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter')acct()}));
$$('.field').forEach(f=>f.addEventListener('click',()=>f.querySelector('input').focus()));

/* ---------- clock (local timezone, no seconds) ---------- */
let lastShown='';
function tick(force){
 const d=new Date();
 const s=d.toLocaleTimeString(lang==='nl'?'nl-NL':'en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}).replace(/\./g,':');
 if(s!==lastShown||force){lastShown=s;$('#clockText').textContent=s}
 checkAlarms(d);updateTimerScreen();
}

/* ---------- timers & alarms ---------- */
let timers=[],ringing=null,beepIv=null;
function fmt(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 const p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`}
function addTimer(kind,whenMs,label){const o={kind,when:whenMs,label,id:Math.random()};timers.push(o);return o}
let activeTm=null;
function showTimer(o){activeTm=o;go('s-timer');updateTimerScreen()}
function updateTimerScreen(){
 if(screen!=='s-timer'||!activeTm)return;
 const t=L(),o=activeTm,rem=(o.when-Date.now())/1000;
 $('#tm-l').textContent=o.kind==='timer'?t.timer:t.alarm;
 $('#tm-t').textContent=fmt(rem);
 $('#tm-s').textContent=o.kind==='timer'?o.label:`${t.alarmAt} ${o.label}`;
}
$('#tm-x').onclick=()=>{timers=timers.filter(x=>x!==activeTm);activeTm=null;go('s-clock')};
function checkAlarms(){
 if(ringing)return;
 const o=timers.find(x=>x.when<=Date.now());if(!o)return;
 timers=timers.filter(x=>x!==o);ringing=o;
 const t=L();$('#r-l').textContent=o.kind==='timer'?t.done:t.ring;$('#r-s').textContent=o.kind==='timer'?o.label:o.label;
 closeBar();go('s-ring');startBeep();
}
function beep(){if(!ctx)return;const n=ctx.currentTime;[0,.22,.44].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=988;g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(.18,n+d+.01);g.gain.linearRampToValueAtTime(0,n+d+.16);o.connect(g).connect(ctx.destination);o.start(n+d);o.stop(n+d+.2)})}
function startBeep(){audioInit();beep();beepIv=setInterval(beep,1400)}
$('#r-x').onclick=()=>{clearInterval(beepIv);beepIv=null;ringing=null;go('s-clock')};
function renderChips(){
 const c=$('#chips');c.textContent='';const t=L();
 if(wake){const d=document.createElement('div');d.className='chip';d.textContent='🎤 HEY WAE';d.title='off';d.onclick=stopListening;c.appendChild(d)}
 timers.forEach(o=>{const d=document.createElement('div');d.className='chip';d.textContent=(o.kind==='timer'?'⏱ ':'⏰ ')+(o.kind==='timer'?fmt((o.when-Date.now())/1000):o.label);d.onclick=()=>showTimer(o);c.appendChild(d)});
 if(player.track){const d=document.createElement('div');d.className='chip';d.textContent='♪ '+player.track.title;d.onclick=()=>go('s-music');c.appendChild(d)}
}
setInterval(()=>{if(screen==='s-clock')renderChips()},1000);

/* ---------- parsing ---------- */
const NUM={een:1,one:1,a:1,an:1,twee:2,two:2,drie:3,three:3,vier:4,four:4,vijf:5,five:5,zes:6,six:6,zeven:7,seven:7,acht:8,eight:8,negen:9,nine:9,tien:10,ten:10,elf:11,eleven:11,twaalf:12,twelve:12,vijftien:15,fifteen:15,twintig:20,twenty:20,dertig:30,thirty:30,veertig:40,forty:40,vijfenveertig:45,fortyfive:45,zestig:60,sixty:60};
const UN='uren|uur|hours?|hrs?|h|minuten|minuut|minutes?|mins?|min|m|seconden|seconde|seconds?|secs?|s';
function parseDur(s){
 let tot=0,found=false;
 if(/kwartier|quarter of an hour|quarter hour/.test(s)){tot+=900;found=true}
 if(/half\s*(uur|hour)|anderhalf|half an hour/.test(s)&&!/half\s*\d/.test(s)){tot+=1800;found=true}
 const re=new RegExp('(\\d+(?:[.,]\\d+)?|'+Object.keys(NUM).join('|')+')\\s*('+UN+')\\b','g');let m;
 while((m=re.exec(s))){const n=/\d/.test(m[1])?parseFloat(m[1].replace(',','.')):NUM[m[1]];const u=m[2][0];
  tot+=n*(u==='u'||u==='h'?3600:u==='m'?60:1);found=true}
 return found?tot:0}
function parseClock(s){
 let m,h,mi=0;
 s=s.replace(/\b(een|twee|drie|vier|vijf|zes|zeven|acht|negen|tien|elf|twaalf|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,w=>NUM[w]);
 if((m=s.match(/half\s*(\d{1,2})\b/))&&!/half\s*(uur|hour)/.test(s)){h=(+m[1]+11)%12+(+m[1]>12?0:0);h=(+m[1]-1+24)%24;mi=30}
 else if((m=s.match(/kwart over\s*(\d{1,2})/))){h=+m[1];mi=15}
 else if((m=s.match(/kwart voor\s*(\d{1,2})/))){h=(+m[1]+23)%24;mi=45}
 else if((m=s.match(/(\d{1,2})\s*[:.h]\s*(\d{2})\s*(am|pm|a\.m\.|p\.m\.)?/))){h=+m[1];mi=+m[2];if(m[3]){const p=m[3][0]==='p';if(p&&h<12)h+=12;if(!p&&h===12)h=0}}
 else if((m=s.match(/(\d{1,2})\s*(uur|u|am|pm|o'?clock)\b/))){h=+m[1];if(/pm/.test(m[2])&&h<12)h+=12;if(/am/.test(m[2])&&h===12)h=0}
 else if((m=s.match(/\b(?:om|at|voor)\s*(\d{1,2})\b/))){h=+m[1]}
 else return null;
 if(h>23||mi>59)return null;
 return [h,mi]}
function nextAt(h,mi){const d=new Date();d.setHours(h,mi,0,0);if(d<=new Date())d.setDate(d.getDate()+1);return d}
const pad2=n=>String(n).padStart(2,'0');

function command(raw){
 const text=raw.trim();if(!text)return false;
 const s=text.toLowerCase().replace(/[!?,]/g,' ').replace(/\s+/g,' ');
 const t=L();
 /* music controls while a song is loaded */
 if(player.track&&/^(pauze|pause|stop( de muziek| music)?|hervat|resume|ga door|continue|volgende|next|vorige|previous)\b/.test(s)){
  if(/^(pauze|pause|stop)/.test(s))player.pause();else if(/^(hervat|resume|ga door|continue)/.test(s))player.play();
  else if(/^(volgende|next)/.test(s))player.next();else player.prev();
  go('s-music');return true}
 if(/^(home|klok|terug|naar huis|go home|back|clock|toon de klok|hoe laat)/.test(s)){go('s-clock');return true}
 /* timer / alarm */
 if(/\b(timer|aftelklok|countdown|wekker|alarm|wek me|wek mij|wake me)\b/.test(s)){
  const isAlarm=/\b(wekker|alarm|wek me|wek mij|wake me)\b/.test(s);
  const dur=parseDur(s);
  if(!isAlarm){

  text=text.replace(WAKE0,'').trim();if(!text)return;
  $('#q').value=((finalText?finalText+' ':'')+text).trim();
  if(final){finalText=$('#q').value;armSilence(AFTER_FINAL)}
  else armSilence(MAX_SILENCE);   /* max 3 s silence, no waiting for the final result */
  return}
 /* "Hey Wae" is also recognised on partial results: no waiting for the recogniser to finish the sentence */
 const m=text.match(WAKE);if(!m)return;
 const rest=text.slice(m.index+m[0].length).trim();
 if(!final&&!rest)return;          /* partial "hey we..." could still become another word */
 showBar();
 if(rest){$('#q').value=rest;finalText=final?rest:'';armSilence(final?500:MAX_SILENCE)}
 else armSilence(MAX_SILENCE)}
function submitBar(){const v=$('#q').value;clearTimeout(silence);if(!v.trim())return;command(v)}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitBar()}else if(e.key==='Escape')closeBar()});
$('#q').addEventListener('input',()=>{finalText=$('#q').value});
function openFromHome(){if(screen!=='s-clock')return;if(barOpen){closeBar();return}showBar();if(!wake)startListening()}
$('#clockText').onclick=openFromHome;$('#b-mic').onclick=openFromHome;
addEventListener('keydown',e=>{
 if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();
  if(screen==='s-clock')openFromHome();else if(screen==='s-music')player.toggle()}
 if(e.key==='Escape'&&barOpen)closeBar()});
(async()=>{
 try{const c=window.claude;if(!c||!c.use)return;
  dict=await c.use('dictation');
  if(dict){
   dict.onPartial(({text})=>heard((text||'').trim(),false));
   dict.onFinal(({text})=>heard((text||'').trim(),true));
   dict.onState(({state,reason})=>{if(state==='idle'){const was=wake;wake=false;$('#bar').classList.remove('listen');if(was&&reason&&['unavailable','not_granted','upstream_error','rate_limited'].includes(reason))micMsg(reason);renderChips()}else if(state==='listening'&&barOpen)$('#bar').classList.add('listen')});
  }
  sampleCap=await c.use('sample');
 }catch(e){}
})();
setInterval(()=>tick(false),500);tick(true);
